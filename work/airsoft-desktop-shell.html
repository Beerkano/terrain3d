<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light">
  <title>Terrain Airsoft 3D</title>
  <style>
<!-- APP_CSS -->
  </style>
  <script>
<!-- APP_STORAGE -->
  </script>
</head>
<body>
  <dialog id="map-dialog" aria-labelledby="map-heading">
    <h2 id="map-heading">Nouvelle carte</h2>
    <label class="form-label">Nom de la carte<input class="form-control" id="map-name" maxlength="60" value="Mon terrain"></label>
    <div class="ate-properties"><label class="form-label">Largeur (m)<input class="form-control" id="map-width" type="number" min="40" max="500" value="100"></label>
    <label class="form-label">Longueur (m)<input class="form-control" id="map-depth" type="number" min="40" max="500" value="160"></label></div>
    <label class="form-label">Forme du terrain<select class="form-select" id="map-shape"><option value="rect">Rectangle</option><option value="ell">En L</option><option value="trapeze">Trapèze</option><option value="libre">Contour libre</option></select></label>
    <label class="form-label" id="map-custom" hidden>Sommets en mètres (X,Z), dans l’ordre du contour<textarea id="map-points" class="form-control" rows="3" placeholder="0,0 ; 100,0 ; 80,120 ; 0,160"></textarea></label>
    <svg id="map-preview" viewBox="-6 -6 112 112" width="100%" height="128" role="img" aria-label="Aperçu du contour"><polygon id="map-polygon" fill="#c4d8b8" stroke="#275b47" stroke-width="1.5"></polygon></svg>
    <p id="map-status" role="status"></p>
    <p class="text-small">La nouvelle carte démarre vide. Enregistre le plan ouvert si tu veux en garder un fichier.</p>
    <div class="viz-row"><button class="btn" id="map-cancel">Annuler</button><button class="btn btn-primary" id="map-create">Créer la carte vide</button></div>
  </dialog>
  <dialog id="shape-dialog" aria-labelledby="shape-title">
    <h2 id="shape-title">Nouvel objet</h2>
    <label class="form-label">Nom<input id="shape-name" class="form-control" maxlength="45" placeholder="Mon objet"></label>
    <label class="form-label">Forme<select class="form-select" id="shape-type"><option value="box">Rectangle</option><option value="round">Cercle</option><option value="custom">Forme libre</option><option value="building">Bâtiment</option><option value="container">Conteneur</option><option value="wall">Mur</option><option value="tarp">Abri en bâche</option></select></label>
    <div id="shape-drawing" hidden><p>Clique sur la grille pour placer les sommets dans l’ordre du contour.</p>
    <svg id="shape-pad" viewBox="0 0 100 100" aria-label="Dessin du contour" style="width:180px;height:180px;background:#edf3eb;cursor:crosshair"><defs><pattern id="shape-grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="#b4c7b5" stroke-width=".5"/></pattern></defs><rect width="100" height="100" fill="url(#shape-grid)"/><polygon id="shape-polygon" fill="#b2ceb4" stroke="#295942" stroke-width="1"/><g id="shape-vertices"></g></svg>
    <button type="button" class="btn" id="shape-back">Retirer le dernier point</button></div>
    <div class="ate-properties"><label class="form-label"><span id="shape-width-label">Largeur (m)</span><input class="form-control" type="number" min=".3" step=".1" value="4" id="shape-w"></label>
    <label class="form-label" id="shape-depth-label">Profondeur (m)<input class="form-control" type="number" min=".3" step=".1" value="4" id="shape-d"></label>
    <label class="form-label">Hauteur (m)<input class="form-control" type="number" min=".3" max="50" step=".1" value="2" id="shape-h"></label>
    <label class="form-label">Couleur<input class="form-control" type="color" value="#996b49" id="shape-color"></label></div>
    <p id="shape-note" role="status"></p>
    <button class="btn" id="shape-cancel">Annuler</button> <button class="btn btn-primary" id="shape-create">Placer sur la carte</button>
  </dialog>
  <main class="desktop-grid">
    <div id="ate-file-tools" aria-label="Fichiers de plan">
      <div class="file-actions">
        <button type="button" class="btn" id="ate-file-new">Nouvelle carte</button>
        <button type="button" class="btn" id="ate-file-open">Ouvrir</button>
        <button type="button" class="btn btn-primary" id="ate-file-save">Enregistrer</button>
      </div>
      <input type="file" id="ate-file-input" accept=".json,application/json" hidden>
      <span class="text-small" role="status" id="ate-file-note"></span>
    </div>
    <!-- APP_FRAGMENT -->
    <div class="material-legend" aria-label="Légende des matériaux">
      <span><i class="swatch swatch-container" aria-hidden="true"></i>Conteneur</span>
      <span><i class="swatch swatch-wood" aria-hidden="true"></i>Bois</span>
      <span><i class="swatch swatch-court" aria-hidden="true"></i>Bâche centrale</span>
      <span><i class="swatch swatch-land" aria-hidden="true"></i>Terrain</span>
      <span title="Code spécifique à Terrain Airsoft 3D. Microsoft WebView2 relève de ses propres conditions.">© 2026 beerkano</span>
    </div>
  </main>

</body>
</html>
